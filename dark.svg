    <text x="505" y="213" opacity="0">UI Engineer<animate attributeName="opacity" values="0;0;0;0;1;0" dur="10s" repeatCount="indefinite"/></text>
    <text x="505" y="213" opacity="0">AI Enthusiast<animate attributeName="opacity" values="0;0;0;0;0;1;0" dur="10s" repeatCount="indefinite"/></text>
