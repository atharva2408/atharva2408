    <g opacity="0"><text y="112">     '.                .'</text><animate attributeName="opacity" values="0;1" dur=".3s" begin="2.6s" fill="freeze"/></g>
    <g opacity="0"><text y="126">       '-.          .-'</text><animate attributeName="opacity" values="0;1" dur=".3s" begin="2.9s" fill="freeze"/></g>
    <g opacity="0"><text y="140">          '--------'</text><animate attributeName="opacity" values="0;1" dur=".3s" begin="3.2s" fill="freeze"/></g>
