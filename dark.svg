    <circle cx="300" cy="52" r="1.2" fill="#A78BFA"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="86" r="1.4" fill="#34D399"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="105" r="1.2" fill="#22D3EE"><animate attributeName="opacity" values="1;.1;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="545" r="1.5" fill="#A78BFA"><animate attributeName="opacity" values=".15;1;.15" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="13" y="13" width="1154" height="584" rx="28" fill="none" stroke="url(#accent)" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="4.5s" repeatCount="indefinite"/></rect>
  <rect x="24" y="24" width="1132" height="562" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>

