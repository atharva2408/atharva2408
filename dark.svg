<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Atharva Yanna — Developer Portfolio</title>
<desc id="desc">Animated GitHub developer profile banner.</desc>
<defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="blueGlow"><stop offset="0%" stop-color="#2563EB" stop-opacity=".22"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop offset="0%" stop-color="#7C3AED" stop-opacity=".18"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="emeraldGlow"><stop offset="0%" stop-color="#10B981" stop-opacity=".13"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="12" y="12" width="1156" height="586" rx="28"/></clipPath>
</defs>

<rect width="1180" height="610" rx="32" fill="#030712"/>
<circle cx="180" cy="110" r="310" fill="url(#blueGlow)" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;40 25;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="470" r="330" fill="url(#violetGlow)" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;-35 -20;0 0" dur="16s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="40" r="230" fill="url(#emeraldGlow)" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;25 35;0 0" dur="11s" repeatCount="indefinite"/></circle>

<g clip-path="url(#clip)">
  <g opacity=".7">
