    <g transform="translate(622 414)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#A78BFA" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">Next.js</text></g>
    <g transform="translate(739 414)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#34D399" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">Node.js</text></g>
    <g transform="translate(856 414)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#38BDF8" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">Python</text></g>
    <g transform="translate(973 414)"><rect width="107" height="32" rx="10" fill="#111C31" stroke="#22D3EE" stroke-opacity=".5"/><text x="53" y="20" text-anchor="middle" fill="#E2E8F0">Docker</text></g>
    <g transform="translate(505 454)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#22D3EE" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">TypeScript</text></g>
    <g transform="translate(622 454)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#34D399" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">Postgres</text></g>
    <g transform="translate(739 454)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#A78BFA" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">AWS</text></g>
    <g transform="translate(856 454)"><rect width="108" height="32" rx="10" fill="#111C31" stroke="#FBBF24" stroke-opacity=".5"/><text x="54" y="20" text-anchor="middle" fill="#E2E8F0">Git</text></g>
    <g transform="translate(973 454)"><rect width="107" height="32" rx="10" fill="#111C31" stroke="#F472B6" stroke-opacity=".5"/><text x="53" y="20" text-anchor="middle" fill="#E2E8F0">Figma</text></g>
