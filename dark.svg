  <circle cx="498" cy="74" r="6" fill="#FB7185"/><circle cx="518" cy="74" r="6" fill="#FBBF24"/><circle cx="538" cy="74" r="6" fill="#34D399"/>
  <text x="795" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748B">// atharva.dev</text>
